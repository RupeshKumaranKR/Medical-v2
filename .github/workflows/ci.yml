name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build (Node 22.x)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run TypeScript Linter & Typecheck
        run: npm run lint

      - name: Execute Clinical Unit & Regression Tests
        run: npm test

      - name: Build Production SPA & Assets
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory was not created!"
            exit 1
          fi
          echo "Build successful! dist/ contents:"
          ls -la dist/
